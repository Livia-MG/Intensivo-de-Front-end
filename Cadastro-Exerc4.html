<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro Mobile</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 1rem;
        }

        .cadastro {
            width: 100%;
            max-width: 25rem;
            background-color: white;
            padding: 1.5rem;
            border-radius: 0.8rem;
            box-shadow: 0 0.3rem 1rem rgba(0, 0, 0, 0.15);
        }

        h1 {
            text-align: center;
            margin-bottom: 0.5rem;
            color: #333;
        }

        .progresso {
            text-align: center;
            color: #777;
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
        }

        .etapa {
            display: none;
        }

        .etapa.ativa {
            display: block;
        }

        label {
            display: block;
            margin-bottom: 0.4rem;
            font-weight: bold;
            color: #444;
        }

        input {
            width: 100%;
            padding: 0.9rem;
            margin-bottom: 1rem;
            border: 1px solid #ccc;
            border-radius: 0.5rem;
            font-size: 1rem;
        }

        input:focus {
            outline: none;
            border-color: #007bff;
        }

        input::placeholder {
            color: #999;
        }

        .botoes {
            display: flex;
            gap: 0.7rem;
            margin-top: 0.5rem;
        }

        button {
            width: 100%;
            padding: 0.9rem;
            border: none;
            border-radius: 0.5rem;
            background-color: #007bff;
            color: white;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }

        .voltar {
            background-color: #777;
        }

        .voltar:hover {
            background-color: #555;
        }

        @media (max-width: 30rem) {
            body {
                padding: 0.5rem;
            }
            .cadastro {
                padding: 1.2rem;
            }**********
            input,
            button {
                min-height: 3rem;
            }
        }
    </style>
</head>

<body>

    <main class="cadastro">
        <h1>Crie sua conta</h1>
        <p class="progresso" id="progresso">
            Etapa 1 de 3
        </p>

        <section class="etapa ativa" id="etapa1">

            <label for="nome">
                Nome
            </label>

            <input
                type="text"
                id="nome"
                placeholder="Digite seu nome"
                autocomplete="name"
            >

            <label for="email">
                E-mail
            </label>

            <input
                type="email"
                id="email"
                placeholder="seuemail@email.com"
                autocomplete="email"
            >

            <button onclick="proximaEtapa(2)">
                Continuar
            </button>

        </section>


        <section class="etapa" id="etapa2">
            <label for="senha">
                Senha
            </label>

            <input
                type="password"
                id="senha"
                placeholder="Digite sua senha"
                autocomplete="new-password"
            >

            <label for="confirmar">
                Confirmar senha
            </label>

            <input
                type="password"
                id="confirmar"
                placeholder="Digite novamente"
                autocomplete="new-password"
            >

            <div class="botoes">
                <button
                    class="voltar"
                    onclick="proximaEtapa(1)">
                    Voltar
                </button>

                <button onclick="proximaEtapa(3)">
                    Continuar
                </button>
            </div>
        </section>


        <section class="etapa" id="etapa3">
            <h2>Cadastro concluído!</h2>
            <p>
                Seus dados foram preenchidos.
                Agora você pode finalizar o cadastro.
            </p>

            <br>

            <button onclick="finalizar()">
                Finalizar cadastro
            </button>
        </section>
    </main>


    <script>
        function proximaEtapa(numero) {
            document.querySelectorAll(".etapa").forEach(function(etapa) {
                etapa.classList.remove("ativa");
            });

            document.getElementById("etapa" + numero)
                .classList.add("ativa");

            document.getElementById("progresso")
                .textContent = "Etapa " + numero + " de 3";
        }


        function finalizar() {
            alert("Cadastro realizado com sucesso!");
        }
    </script>

</body>
</html>
