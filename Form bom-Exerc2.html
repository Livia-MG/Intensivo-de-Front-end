<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .formulario {
            width: 100%;
            max-width: 450px;
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
            color: #333;
        }

        .descricao {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        .campo {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
            color: #444;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }

        input:focus {
            outline: none;
            border-color: #007bff;
            box-shadow: 0 0 0 3px rgba(0, 123, 255, 0.15);
        }

        input::placeholder {
            color: #999;
        }

        .ajuda {
            display: block;
            margin-top: 5px;
            color: #777;
            font-size: 13px;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }

        @media (max-width: 500px) {

            .formulario {
                padding: 22px;
            }

        }

    </style>

</head>

<body>

    <main class="formulario">

        <h1>Crie sua conta</h1>

        <p class="descricao">
            Preencha seus dados para realizar o cadastro.
        </p>

        <form>

            <div class="campo">
                <label for="nome">
                    Nome completo
                </label>
                <input
                    type="text"
                    id="nome"
                    name="nome"
                    placeholder="Digite seu nome completo"
                    required
                >
            </div>


            <div class="campo">
                <label for="email">
                    E-mail
                </label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="exemplo@email.com"
                    required
                >
            </div>


            <div class="campo">
                <label for="senha">
                    Senha
                </label>
                <input
                    type="password"
                    id="senha"
                    name="senha"
                    placeholder="Digite sua senha"
                    required
                >
                <small class="ajuda">
                    Use pelo menos 8 caracteres.
                </small>
            </div>


            <div class="campo">
                <label for="telefone">
                    Telefone
                </label>
                <input
                    type="tel"
                    id="telefone"
                    name="telefone"
                    placeholder="(00) 00000-0000"
                >
            </div>


            <button type="submit">
                Criar conta
            </button>

        </form>
    </main>
</body>
</html>
